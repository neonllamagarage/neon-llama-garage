<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neon Llama Garage | Custom Diecast</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: #030305; --grid-color: rgba(0, 240, 255, 0.12);
      --card-bg: rgba(10, 10, 15, 0.75); --card-border: rgba(255, 255, 255, 0.08);
      --neon-pink: #ff107a; --neon-cyan: #00f0ff; --neon-yellow: #ffc107;
      --text-main: #ffffff; 
    }
    body { background-color: var(--bg-color); color: var(--text-main); font-family: 'Rajdhani', sans-serif; min-height: 100vh; overflow-x: hidden; margin: 0; }
    body::before { content: ""; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: linear-gradient(transparent 60%, var(--neon-pink) 160%), linear-gradient(rgba(3,3,5,0.92) 0%, rgba(3,3,5,0.5) 100%); z-index: -2; }
    .grid-bg { position: fixed; bottom: -50%; left: -50%; width: 200%; height: 100%; background-image: linear-gradient(var(--grid-color) 1px, transparent 1px), linear-gradient(90deg, var(--grid-color) 1px, transparent 1px); background-size: 40px 40px; transform: perspective(500px) rotateX(60deg); z-index: -1; animation: gridMove 15s linear infinite; opacity: 0.5; }
    @keyframes gridMove { 0% { transform: perspective(500px) rotateX(60deg) translateY(0); } 100% { transform: perspective(500px) rotateX(60deg) translateY(40px); } }

    .top-nav { background-color: rgba(5, 5, 8, 0.92); backdrop-filter: blur(14px); border-bottom: 2px solid rgba(255, 16, 122, 0.4); padding: 15px 40px; position: sticky; top: 0; z-index: 1000; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 6px 30px rgba(255, 16, 122, 0.25); }
    .nav-brand-container { display: flex; align-items: center; gap: 25px; }
    .nav-llama-logo { height: 90px; width: auto; filter: drop-shadow(0 0 16px rgba(255, 16, 122, 0.9)) drop-shadow(0 0 6px rgba(0, 240, 255, 0.6)); }
    .nav-brand-text { font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 2.2rem; letter-spacing: 2.5px; color: var(--text-main); text-transform: uppercase; margin: 0; text-shadow: 0 0 12px rgba(255,255,255,0.3); }
    .nav-brand-text span { color: var(--neon-cyan); text-shadow: 0 0 15px rgba(0, 240, 255, 0.6); }
    .header-tagline { font-family: 'Orbitron', sans-serif; font-size: 0.9rem; color: var(--neon-pink); letter-spacing: 4px; text-transform: uppercase; margin: 4px 0 0 0; text-shadow: 0 0 8px rgba(255, 16, 122, 0.5); }

    /* Hero Billboard */
    .hero-billboard { position: relative; width: 100%; max-width: 1400px; margin: 20px auto; border: 2px solid var(--neon-cyan); border-radius: 12px; overflow: hidden; display: none; box-shadow: 0 0 30px rgba(0, 240, 255, 0.2); }
    .hero-bg { width: 100%; height: 400px; object-fit: cover; opacity: 0.5; }
    .hero-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(90deg, rgba(3,3,5,0.95) 0%, rgba(3,3,5,0.2) 100%); display: flex; flex-direction: column; justify-content: center; padding: 50px; }
    .hero-phase { font-family: 'Orbitron'; letter-spacing: 4px; font-size: 1.1rem; font-weight: 900; margin-bottom: 5px; }
    .hero-title { font-family: 'Orbitron'; font-size: 3.5rem; font-weight: 900; line-height: 1.1; margin: 0 0 10px 0; text-transform: uppercase; text-shadow: 0 0 15px rgba(255,255,255,0.3); }
    .hero-countdown { font-family: 'Orbitron'; font-size: 2.2rem; color: var(--neon-yellow); font-weight: 700; text-shadow: 0 0 15px rgba(255, 193, 7, 0.5); margin-bottom: 25px; }

    /* Launch Ledger */
    .ledger-container { max-width: 1400px; margin: 0 auto 30px; padding: 0 40px; }
    .ledger-row { background: var(--card-bg); border: 1px solid var(--card-border); border-left: 4px solid var(--neon-cyan); padding: 15px 25px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; transition: all 0.3s; }
    .ledger-row:hover { background: rgba(10, 10, 15, 0.95); border-color: var(--neon-cyan); box-shadow: 0 0 15px rgba(0, 240, 255, 0.15); }
    .ledger-date { font-family: 'Orbitron'; color: var(--neon-cyan); font-weight: 700; width: 150px; flex-shrink: 0; }
    .ledger-info { flex-grow: 1; padding: 0 20px; }
    .ledger-theme { font-weight: 700; font-size: 1.2rem; margin: 0; letter-spacing: 1px; text-transform: uppercase;}
    .ledger-model { color: #8b9eb3; font-size: 0.95rem; margin: 0; font-weight: 600; }
    @media (max-width: 768px) { .ledger-row { flex-direction: column; align-items: flex-start; gap: 15px; } .ledger-date { width: 100%; border-bottom: 1px solid var(--card-border); padding-bottom: 8px;} .ledger-info { padding: 0; } }

    /* Tabs */
    .nav-tabs { border-bottom: 1px solid var(--card-border); margin: 20px 40px; }
    .nav-tabs .nav-link { color: #d1d5db; font-family: 'Orbitron', sans-serif; font-weight: 700; border: none; text-transform: uppercase; letter-spacing: 1px; background: transparent; transition: all 0.3s; cursor: pointer;}
    .nav-tabs .nav-link:hover { color: var(--neon-cyan); }
    .nav-tabs .nav-link.active { color: var(--neon-pink); border-bottom: 2px solid var(--neon-pink); background: transparent; text-shadow: 0 0 8px rgba(255, 16, 122, 0.5); }

    .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; padding: 20px 40px 80px; max-width: 1400px; margin: 0 auto; }
    .diecast-card { background: var(--card-bg); backdrop-filter: blur(12px); border: 1px solid var(--card-border); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5); transition: all 0.3s; cursor: pointer; position: relative; }
    .diecast-card:hover { transform: translateY(-5px); border-color: rgba(0, 240, 255, 0.4); box-shadow: 0 20px 40px rgba(0,0,0,0.6), 0 0 15px rgba(0, 240, 255, 0.15); }
    .diecast-img { width: 100%; height: 210px; object-fit: cover; background: #000; border-bottom: 1px solid var(--card-border); }
    
    .sold-out-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 210px; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; z-index: 5; backdrop-filter: grayscale(100%); }
    .sold-out-text { font-family: 'Orbitron', sans-serif; color: #fff; font-size: 2rem; font-weight: 900; letter-spacing: 4px; text-shadow: 0 0 15px rgba(255,0,0,0.8); border: 3px solid #ff0000; padding: 10px 20px; transform: rotate(-10deg); }

    .btn-buy { background: linear-gradient(45deg, transparent 5%, var(--neon-pink) 5%); border: none; color: #fff; font-family: 'Orbitron', sans-serif; font-weight: 900; letter-spacing: 2px; padding: 11px 18px; display: block; text-transform: uppercase; transition: all 0.3s; box-shadow: 5px 0px 0px var(--neon-cyan); font-size: 0.95rem; width: 100%; text-align: center; }
    .btn-buy:hover { background: linear-gradient(45deg, transparent 5%, var(--neon-cyan) 5%); box-shadow: 5px 0px 0px var(--neon-pink); color: #000; }
    
    .btn-waitlist { background: linear-gradient(45deg, transparent 5%, var(--neon-yellow) 5%); box-shadow: 5px 0px 0px #ff9800; color: #000; }
    .btn-waitlist:hover { background: linear-gradient(45deg, transparent 5%, #ff9800 5%); box-shadow: 5px 0px 0px var(--neon-yellow); color: #000; }

    /* Modal Styling */
    .modal-content { background-color: rgba(10, 10, 15, 0.95); backdrop-filter: blur(20px); border: 1px solid var(--neon-cyan); border-radius: 12px; color: #fff; box-shadow: 0 0 40px rgba(0, 240, 255, 0.2); }
    .modal-header { border-bottom: 1px solid var(--card-border); }
    .carousel-inner img { height: 400px; object-fit: contain; background: #000; border-radius: 8px; border: 1px solid var(--card-border); }

    /* HIGH CONTRAST Footer Forms */
    .footer-section { background: rgba(5, 5, 8, 0.95); border-top: 2px solid rgba(0, 240, 255, 0.4); padding: 60px 20px; margin-top: 60px; position: relative; z-index: 10; }
    
    .form-control-cyber { 
      background: rgba(10, 10, 15, 0.9); 
      border: 2px solid var(--neon-cyan); 
      color: #ffffff !important; 
      font-family: 'Rajdhani', sans-serif; 
      font-size: 1.1rem;
      padding: 10px 15px; 
      box-shadow: 0 0 8px rgba(0, 240, 255, 0.1);
    }
    
    .form-control-cyber:focus { 
      background: #000000; 
      border-color: var(--neon-pink); 
      box-shadow: 0 0 15px rgba(255, 16, 122, 0.4); 
      outline: none; 
    }
    
    .form-control-cyber::placeholder { 
      color: rgba(255, 255, 255, 0.65) !important; 
      font-weight: 500;
    }

    .high-contrast-text { color: #f8fafc !important; font-weight: 600; font-size: 1.1rem; }
  </style>
</head>
<body>

  <div class="grid-bg"></div>

  <header class="top-nav">
    <div class="nav-brand-container">
      <img src="llama-icon.png" alt="Neon Llama Logo" class="nav-llama-logo" onerror="this.style.display='none'">
      <div>
        <h1 class="nav-brand-text">Neon Llama <span>Garage</span></h1>
        <p class="header-tagline">Custom Diecast Vault</p>
      </div>
    </div>
  </header>

  <!-- Hero Billboard Injection Point -->
  <div style="padding: 0 40px;">
    <section id="heroBillboard" class="hero-billboard"></section>
  </div>

  <!-- Launch Ledger Injection Point -->
  <section id="launchLedgerContainer" class="ledger-container" style="display:none;">
    <h3 style="font-family:'Orbitron'; font-size: 1.4rem; font-weight: 700; margin: 20px 0; text-shadow: 0 0 10px rgba(255,255,255,0.2);">UPCOMING <span style="color:var(--neon-pink);">DROPS</span></h3>
    <div id="launchLedgerGrid"></div>
  </section>

  <!-- Dynamic Tabs -->
  <ul class="nav nav-tabs" id="seriesTabs" role="tablist">
      <li class="nav-item"><button class="nav-link active" onclick="renderGrid('AVAILABLE', event)">AVAILABLE DROPS</button></li>
  </ul>

  <main class="container-fluid">
    <div id="catalogGrid" class="product-grid"></div>
  </main>

  <!-- Detail Modal -->
  <div class="modal fade" id="productModal" tabindex="-1">
    <div class="modal-dialog modal-xl modal-dialog-centered">
      <div class="modal-content p-2">
        <div class="modal-header border-0">
          <h4 class="modal-title font-monospace fw-bold text-info" id="modTitle">Loading...</h4>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body row g-4">
          <div class="col-lg-7">
            <div id="modCarousel" class="carousel slide" data-bs-interval="false">
              <div class="carousel-inner" id="modCarouselInner"></div>
              <button class="carousel-control-prev" type="button" data-bs-target="#modCarousel" data-bs-slide="prev">
                <span class="carousel-control-prev-icon"></span>
              </button>
              <button class="carousel-control-next" type="button" data-bs-target="#modCarousel" data-bs-slide="next">
                <span class="carousel-control-next-icon"></span>
              </button>
            </div>
          </div>
          <div class="col-lg-5 d-flex flex-column">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <span id="modPrice" class="fs-3 fw-bold" style="font-family:'Orbitron';"></span>
              <span id="modBadge" class="badge bg-dark border border-info text-info p-2" style="font-family:'Orbitron';"></span>
            </div>
            <div id="modDesc" class="mb-4 high-contrast-text"></div>
            <div id="modCtaContainer" class="mt-auto"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <footer class="footer-section">
    <div style="max-width: 1400px; margin: 0 auto;" class="row g-5">
      <div class="col-md-5">
        <h3 class="section-title" style="font-family:'Orbitron'; color:var(--neon-cyan);">JOIN THE GARAGE</h3>
        <p class="high-contrast-text mb-3">Sign up for early access to drops and exclusive chases.</p>
        <form class="d-flex gap-2" onsubmit="submitNativeForm(event, 'Newsletter')">
          <input type="email" id="nlEmail" class="form-control form-control-cyber" placeholder="ENTER YOUR EMAIL" required>
          <button type="submit" id="nlBtn" class="btn-buy" style="width:auto;">SUBSCRIBE</button>
        </form>
      </div>
      <div class="col-md-7">
        <h3 class="section-title" style="font-family:'Orbitron'; color:var(--neon-cyan);">SECURE COMM LINK</h3>
        <form onsubmit="submitNativeForm(event, 'Contact')">
          <div class="row g-3 mb-3">
            <div class="col-sm-6"><input type="text" id="ctName" class="form-control form-control-cyber" placeholder="NAME" required></div>
            <div class="col-sm-6"><input type="email" id="ctEmail" class="form-control form-control-cyber" placeholder="EMAIL ADDRESS" required></div>
          </div>
          <textarea id="ctMsg" class="form-control form-control-cyber mb-3" rows="3" placeholder="TRANSMISSION..." required></textarea>
          <button type="submit" id="ctBtn" class="btn-buy">TRANSMIT MESSAGE</button>
        </form>
      </div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
  // Exact Endpoint configured
  const GAS_ENDPOINT = 'https://script.google.com/macros/s/AKfycbxe1WwM8zoYYR1aU4N2EcsqvAjh0PXgVzPwIh1ZnwaB4YYdfwI-fd8eJysx37lgMplHwQ/exec';
  
  let globalBatches = [];
  let productModal;
  let countdownTimer;

  function convertDriveUrl(url) {
    if (!url) return '';
    let match = url.match(/\/d\/([a-zA-Z0-9_-]+)/) || url.match(/id=([a-zA-Z0-9_-]+)/);
    return match ? `https://drive.google.com/thumbnail?id=${match[1]}&sz=w800` : url;
  }

  async function loadCatalog() {
    productModal = new bootstrap.Modal(document.getElementById('productModal'));
    const grid = document.getElementById('catalogGrid');
    
    // Immersive Terminal Loader injected instantly
    grid.innerHTML = `
      <div class="text-center w-100 py-5" style="grid-column: 1 / -1;">
        <div class="p-4 mx-auto rounded" style="max-width: 500px; background: rgba(3,3,5,0.9); border: 2px solid var(--neon-cyan); box-shadow: 0 0 25px rgba(0,240,255,0.25); text-align: left; font-family: 'Orbitron', monospace;">
          <div class="d-flex align-items-center mb-3 border-bottom border-secondary pb-2">
            <div class="spinner-border spinner-border-sm text-info me-2"></div>
            <span class="text-info fw-bold" style="font-size: 0.85rem; letter-spacing: 2px;">NEON LLAMA OS v6.0</span>
          </div>
          <div id="termLog" class="text-muted" style="font-size: 0.75rem; line-height: 1.6; color: #a0aec0 !important; height: 90px; overflow: hidden;">
            > INITIALIZING SYSTEM CORE...<br>
          </div>
        </div>
      </div>
    `;

    const logEl = document.getElementById('termLog');
    const logs = [
        "> ESTABLISHING SECURE PIPELINE TO VAULT...",
        "> BYPASSING LOCAL HOST RESTRICTIONS...",
        "> SYNCING UTAH & TEXAS INVENTORY NODES...",
        "> DECRYPTING CHASE ALGORITHM & ASSETS...",
        "> ESTABLISHING NEON GRID..."
    ];
    
    let logIdx = 0;
    let logInterval = setInterval(() => {
        if (logIdx < logs.length && logEl) {
            logEl.innerHTML += logs[logIdx] + "<br>";
            logEl.scrollTop = logEl.scrollHeight;
            logIdx++;
        }
    }, 300);

    try {
        const res = await fetch(GAS_ENDPOINT + '?feed=public');
        const data = await res.json();
        
        clearInterval(logInterval);
        
        if(!data.success) {
            grid.innerHTML = `<div class="text-center w-100"><h4 class="text-danger" style="font-family:'Orbitron';">SYSTEM ERROR: Failed to parse inventory.</h4></div>`;
            return;
        }
        
        globalBatches = data.batches || [];
        processTimeData(); 

        const themes = [...new Set(globalBatches.map(b => b.theme))].sort();
        const tabList = document.getElementById('seriesTabs');
        tabList.innerHTML = `<li class="nav-item"><button class="nav-link active" onclick="renderGrid('AVAILABLE', event)">AVAILABLE DROPS</button></li>`;
        
        themes.forEach(t => {
            tabList.innerHTML += `<li class="nav-item"><button class="nav-link" onclick="renderGrid('${t}', event)">${t}</button></li>`;
        });
        
        renderGrid('AVAILABLE', null);
    } catch (err) {
        clearInterval(logInterval);
        grid.innerHTML = `
          <div class="text-center w-100 py-5" style="grid-column: 1 / -1;">
            <h4 class="text-danger fw-bold" style="font-family:'Orbitron';">CONNECTION ERROR</h4>
            <p class="text-muted">The browser blocked the connection to Google Apps Script.</p>
            <p class="small text-info mt-3">Fix: Ensure your Apps Script Web App is deployed as a "New Version" with Access set to "Anyone".</p>
          </div>`;
    }
  }

  function processTimeData() {
      const now = new Date();
      const thirtyDaysOut = new Date(now.getTime() + (30 * 24 * 60 * 60 * 1000));

      globalBatches.forEach(b => {
          b.dropTime = b.launchDate ? new Date(b.launchDate) : null;
          b.isUpcoming = b.dropTime && b.dropTime > now;
          b.ageMs = b.dropTime ? now.getTime() - b.dropTime.getTime() : 0;
      });

      let billboardBatch = null;
      let recentLive = globalBatches.filter(b => b.dropTime && b.ageMs >= 0 && b.ageMs <= (72 * 60 * 60 * 1000) && b.totalStock > 0);
      
      if (recentLive.length > 0) {
          recentLive.sort((a, b) => a.ageMs - b.ageMs);
          billboardBatch = recentLive[0];
      } else {
          let upcoming = globalBatches.filter(b => b.isUpcoming);
          if (upcoming.length > 0) {
              upcoming.sort((a, b) => a.dropTime.getTime() - b.dropTime.getTime());
              billboardBatch = upcoming[0];
          }
      }

      if (billboardBatch) renderBillboard(billboardBatch);

      let ledgerDrops = globalBatches.filter(b => b.isUpcoming && b.dropTime <= thirtyDaysOut);
      ledgerDrops.sort((a, b) => a.dropTime.getTime() - b.dropTime.getTime());
      renderLedger(ledgerDrops.slice(0, 8));
  }

  function renderBillboard(item) {
      const wrapper = document.getElementById('heroBillboard');
      wrapper.style.display = 'block';
      const hero = item.heroImg ? convertDriveUrl(item.heroImg) : '';
      
      wrapper.innerHTML = `
        <img src="${hero}" class="hero-bg">
        <div class="hero-overlay">
           <div id="bbPhase" class="hero-phase"></div>
           <h2 class="hero-title">${item.theme}<br><span style="font-size: 2rem; color: #d1d5db;">${item.model}</span></h2>
           <div id="bbCountdown" class="hero-countdown"></div>
           <div style="max-width: 320px;" id="bbCta"></div>
        </div>
      `;
      
      clearInterval(countdownTimer);
      updateBillboardTick(item);
      countdownTimer = setInterval(() => updateBillboardTick(item), 1000);
  }

  function updateBillboardTick(item) {
      const now = new Date();
      const cLabel = document.getElementById('bbCountdown');
      const pLabel = document.getElementById('bbPhase');
      const cta = document.getElementById('bbCta');
      if(!cLabel) return;

      if (item.totalStock <= 0) {
          pLabel.innerText = "THE VAULT"; pLabel.style.color = "#ff0000"; pLabel.style.textShadow = "0 0 10px #ff0000";
          cLabel.innerText = "SOLD OUT"; cLabel.style.color = "#ff0000";
          cta.innerHTML = `<button class="btn-buy" disabled style="background: rgba(255,0,0,0.2); box-shadow: none;">OUT OF STOCK</button>`;
          return;
      }

      if (item.dropTime <= now) {
          pLabel.innerText = "LIVE NOW"; pLabel.style.color = "var(--neon-cyan)"; pLabel.style.textShadow = "0 0 10px var(--neon-cyan)";
          cLabel.innerText = "AVAILABLE"; cLabel.style.color = "#fff";
          if (item.stripeLink) {
              cta.innerHTML = `<a href="${item.stripeLink}" target="_blank" class="btn-buy text-decoration-none" style="font-size:1.1rem; padding: 14px;">SECURE NOW</a>`;
          } else {
              cta.innerHTML = `<button class="btn-buy" onclick="alert('Checkout link synchronizing...')">STANDBY</button>`;
          }
      } else {
          let diff = item.dropTime.getTime() - now.getTime();
          pLabel.innerText = diff <= (24*60*60*1000) ? "REVEAL PHASE" : "TEASER PHASE";
          pLabel.style.color = "var(--neon-pink)"; pLabel.style.textShadow = "0 0 10px var(--neon-pink)";

          let d = Math.floor(diff / (1000 * 60 * 60 * 24));
          let h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
          let m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
          let s = Math.floor((diff % (1000 * 60)) / 1000);
          
          let timeStr = d > 0 ? `${d}D ` : '';
          timeStr += `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
          
          cLabel.innerText = `T-MINUS ${timeStr}`;
          cta.innerHTML = `<button class="btn-buy btn-waitlist" style="font-size:1.1rem; padding: 14px;" onclick='openModal(${JSON.stringify(item).replace(/'/g, "&apos;")})'>NOTIFY ME</button>`;
      }
  }

  function renderLedger(drops) {
      const container = document.getElementById('launchLedgerContainer');
      const grid = document.getElementById('launchLedgerGrid');
      
      if (drops.length === 0) {
          container.style.display = 'none'; return;
      }
      
      container.style.display = 'block';
      grid.innerHTML = drops.map(b => {
          const dStr = b.dropTime ? b.dropTime.toLocaleDateString('en-US', {month: 'short', day: 'numeric'}).toUpperCase() : 'TBA';
          const tStr = b.dropTime ? b.dropTime.toLocaleTimeString('en-US', {hour: '2-digit', minute:'2-digit', timeZoneName: 'short'}) : '';
          
          return `
          <div class="ledger-row">
              <div class="ledger-date">${dStr}<br><span style="font-size: 0.8rem; color: #8b9eb3;">${tStr}</span></div>
              <div class="ledger-info">
                  <p class="ledger-theme">${b.theme}</p>
                  <p class="ledger-model">${b.model}</p>
              </div>
              <div style="width: 140px; flex-shrink: 0;">
                  <button class="btn-buy btn-waitlist w-100 py-2" style="font-size: 0.8rem;" onclick='openModal(${JSON.stringify(b).replace(/'/g, "&apos;")})'>LOCK IN</button>
              </div>
          </div>`;
      }).join('');
  }

  function renderGrid(filter, e) {
    document.querySelectorAll('.nav-link').forEach(btn => btn.classList.remove('active'));
    if (e && e.target) {
        e.target.classList.add('active');
    } else {
        const firstTab = document.querySelector('.nav-tabs .nav-link');
        if (firstTab) firstTab.classList.add('active');
    }

    const grid = document.getElementById('catalogGrid');
    let filtered = globalBatches;
    
    if (filter === 'AVAILABLE') {
        filtered = globalBatches.filter(b => b.totalStock > 0);
    } else {
        filtered = globalBatches.filter(b => b.theme === filter);
    }

    if (filtered.length === 0) {
        grid.innerHTML = `<h5 class="high-contrast-text w-100 text-center py-5" style="font-family:'Orbitron';">NO CARS FOUND IN THIS SECTOR</h5>`;
        return;
    }

    const now = new Date();

    grid.innerHTML = filtered.map(item => {
        const hero = item.heroImg ? convertDriveUrl(item.heroImg) : '';
        const isSoldOut = item.totalStock <= 0;
        const dropTime = item.launchDate ? new Date(item.launchDate) : null;
        const isLocked = dropTime && dropTime > now;

        const overlay = isSoldOut ? `<div class="sold-out-overlay"><div class="sold-out-text">SOLD OUT</div></div>` : '';
        const runSize = item.plannedTotal > 0 ? `ONLY ${item.plannedTotal} EVER MADE` : 'CUSTOM RUN';

        let cta = '';
        if (isSoldOut) {
            cta = `<button class="btn-buy w-100 bg-secondary shadow-none mt-3" disabled onclick="event.stopPropagation()">SOLD OUT</button>`;
        } else if (isLocked) {
            cta = `<button class="btn-buy w-100 btn-waitlist mt-3" disabled onclick="event.stopPropagation()">DROPS ${dropTime.toLocaleDateString('en-US', {month: 'short', day: 'numeric', hour: 'numeric', minute:'2-digit'})}</button>`;
        } else if (item.stripeLink) {
            cta = `<a href="${item.stripeLink}" target="_blank" class="btn-buy w-100 mt-3 text-decoration-none" onclick="event.stopPropagation()">SECURE NOW</a>`;
        } else {
            cta = `<button class="btn-buy w-100 btn-waitlist mt-3" onclick="event.stopPropagation(); alert('Checkout link pending for ${item.model}')">STANDBY</button>`;
        }
        
        return `
          <div class="diecast-card" onclick='openModal(${JSON.stringify(item).replace(/'/g, "&apos;")})'>
            <div class="position-relative">
              <span class="badge bg-dark border border-info text-info position-absolute top-0 end-0 m-2 z-3" style="font-family: 'Orbitron'; font-size: 0.65rem; box-shadow: 0 0 8px rgba(0, 240, 255, 0.4);">${runSize}</span>
              ${overlay}
              <img src="${hero}" class="diecast-img">
            </div>
            <div class="p-3 d-flex flex-column flex-grow-1">
              <h5 class="fw-bold mb-1" style="font-family:'Orbitron';">${item.theme}</h5>
              <div class="d-flex justify-content-between align-items-center">
                  <p class="text-info fw-bold mb-0">${item.model}</p>
                  <span class="price-tag fs-5 fw-bold">$${item.minPrice.toFixed(2)}</span>
              </div>
              <div class="mt-auto pt-2 border-top border-secondary mt-3">
                  ${cta}
              </div>
            </div>
          </div>`;
    }).join('');
  }

  function openModal(item) {
      document.getElementById('modTitle').innerText = item.title;
      document.getElementById('modPrice').innerText = `$${item.minPrice.toFixed(2)}`;
      document.getElementById('modDesc').innerHTML = item.desc;
      document.getElementById('modBadge').innerText = item.plannedTotal > 0 ? `ONLY ${item.plannedTotal} EVER MADE` : 'CUSTOM RUN';

      let slides = '';
      if (item.images && item.images.length > 0) {
          item.images.forEach((url, i) => {
              slides += `<div class="carousel-item ${i===0?'active':''}"><img src="${convertDriveUrl(url)}" class="d-block w-100"></div>`;
          });
      } else {
          slides = `<div class="carousel-item active"><img src="${item.heroImg ? convertDriveUrl(item.heroImg) : ''}" class="d-block w-100"></div>`;
      }
      document.getElementById('modCarouselInner').innerHTML = slides;

      const now = new Date();
      const dropTime = item.launchDate ? new Date(item.launchDate) : null;
      const isSoldOut = item.totalStock <= 0;
      const isLocked = dropTime && dropTime > now;

      let cta = '';
      if (isSoldOut) {
          cta = `<button class="btn-buy w-100 bg-secondary shadow-none" disabled>SOLD OUT</button>`;
      } else if (isLocked) {
          cta = `<button class="btn-buy w-100 btn-waitlist" disabled>DROPS ${dropTime.toLocaleDateString('en-US', {month: 'short', day: 'numeric', hour: 'numeric', minute:'2-digit'})}</button>`;
      } else if (item.stripeLink) {
          cta = `<a href="${item.stripeLink}" target="_blank" class="btn-buy w-100 text-decoration-none">SECURE NOW</a>`;
      } else {
          cta = `<button class="btn-buy w-100 btn-waitlist" onclick="alert('Checkout link pending for ${item.model}')">STANDBY</button>`;
      }
      document.getElementById('modCtaContainer').innerHTML = cta;

      productModal.show();
  }

  function submitNativeForm(e, type) {
      e.preventDefault();
      const btnId = type === 'Newsletter' ? 'nlBtn' : 'ctBtn';
      const btn = document.getElementById(btnId);
      btn.innerText = "TRANSMITTING...";
      btn.disabled = true;

      const payload = {
          type: type,
          email: type === 'Newsletter' ? document.getElementById('nlEmail').value : document.getElementById('ctEmail').value,
          name: type === 'Contact' ? document.getElementById('ctName').value : "",
          message: type === 'Contact' ? document.getElementById('ctMsg').value : ""
      };

      fetch(GAS_ENDPOINT, { method: 'POST', body: JSON.stringify(payload) })
          .then(() => {
              btn.innerText = "TRANSMITTED ✅";
              e.target.reset();
              setTimeout(() => {
                  btn.innerText = type === 'Newsletter' ? "SUBSCRIBE" : "TRANSMIT MESSAGE";
                  btn.disabled = false;
              }, 3000);
          })
          .catch(err => {
              btn.innerText = "ERROR - RETRY";
              btn.disabled = false;
          });
  }

  document.addEventListener('DOMContentLoaded', loadCatalog);
  </script>
</body>
</html>
